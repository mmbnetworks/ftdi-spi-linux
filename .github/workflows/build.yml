# SPDX-License-Identifier: GPL-2.0
# Build the spi-ft232h out-of-tree kernel module for:
#   - Ubuntu x86_64 (native)
#   - Ubuntu ARM64  (native, GitHub ARM runner)
#   - Raspberry Pi arm64 / armhf (cross-compile against RPi kernel)

name: Build Driver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------
  # Native builds: x86_64 and ARM64 Ubuntu against linux-headers-generic
  # ---------------------------------------------------------------
  native:
    name: Ubuntu ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd linux-headers-generic

      # sort -V, not `tail -1` on ls output: lexically 6.8.0-9-generic sorts
      # after 6.8.0-84-generic, so a plain tail picks the older ABI whenever two
      # header trees are installed.
      - name: Build module
        run: |
          set -euo pipefail
          KVER=$(ls -1 /usr/src \
                 | sed -n 's/^linux-headers-\(.*-generic\)$/\1/p' \
                 | sort -V | tail -1)
          [ -n "$KVER" ] || { echo "no linux-headers-*-generic found"; exit 1; }
          echo "Building against $KVER"
          make -C src KDIR="/usr/src/linux-headers-$KVER"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spi-ft232h-ubuntu-${{ matrix.arch }}
          path: |
            src/spi-ft232h.ko
            src/spi-ft232h.ko.zst

  # ---------------------------------------------------------------
  # DKMS package build
  # ---------------------------------------------------------------
  dkms:
    name: DKMS Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          path: ftdi-spi-linux

      - name: Install dkms build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-dkms dkms

      - name: Build package
        run: cd ftdi-spi-linux && dpkg-buildpackage -us -uc -b

      # Building the .deb only proves the packaging is well-formed. Compiling it
      # is what exercises dkms.conf and catches a wrong BUILT_MODULE_NAME.
      #
      # Build against linux-headers-generic rather than the runner's own kernel:
      # GitHub runners boot an Azure kernel whose matching linux-headers package
      # is not reliably in the archive. Absent headers are NOT fatal to dkms --
      # common.postinst skips that kernel and exits 0 -- so the explicit
      # build/install below is what guarantees a compile actually happened.
      #
      # Kept as separate steps so a failure is attributable from the job summary
      # without having to open the log.
      - name: Install generic kernel headers
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends linux-headers-generic
          echo "runner kernel: $(uname -r)"
          echo "--- /usr/src ---";     ls -1 /usr/src
          echo "--- /lib/modules ---"; ls -1 /lib/modules

      - name: Resolve target kernel
        id: kver
        run: |
          set -euo pipefail
          KVER=$(ls -1 /usr/src \
                 | sed -n 's/^linux-headers-\(.*-generic\)$/\1/p' \
                 | sort -V | tail -1)
          if [ -z "$KVER" ]; then
            echo "::error::no linux-headers-*-generic under /usr/src"; exit 1
          fi
          if [ ! -d "/lib/modules/$KVER/build" ]; then
            echo "::error::/lib/modules/$KVER/build is missing"
            ls -la "/lib/modules/$KVER" || true
            exit 1
          fi
          echo "target kernel: $KVER"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"

      - name: Install DKMS package
        run: |
          set -euo pipefail
          ls -la ftdi-spi-linux_*_all.deb
          sudo dpkg -i ftdi-spi-linux_*_all.deb
          dkms status

      - name: Build module via DKMS
        run: |
          set -euo pipefail
          KVER='${{ steps.kver.outputs.kver }}'
          VER=$(ls -d /usr/src/ftdi-spi-linux-* | sed 's|.*/ftdi-spi-linux-||')
          echo "module version: $VER"
          sudo dkms build   -m ftdi-spi-linux -v "$VER" -k "$KVER"
          sudo dkms install -m ftdi-spi-linux -v "$VER" -k "$KVER"

      - name: Verify module installed
        run: |
          set -euo pipefail
          KVER='${{ steps.kver.outputs.kver }}'
          # Capture first rather than `... | tee /dev/stderr | grep -q`: grep -q
          # exits on the first match and can SIGPIPE tee, which pipefail then
          # turns into a spurious failure.
          status=$(dkms status -m ftdi-spi-linux -k "$KVER")
          echo "$status"
          echo "$status" | grep -q ': installed'
          ko=$(ls -1 /lib/modules/"$KVER"/updates/dkms/spi-ft232h.ko* | head -1)
          echo "installed module: $ko"
          modinfo "$ko"

      - name: DKMS build log (on failure)
        if: failure()
        run: |
          for f in /var/lib/dkms/ftdi-spi-linux/*/build/make.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
          sudo dkms status || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftdi-spi-linux
          path: ftdi-spi-linux_*_all.deb


  # ---------------------------------------------------------------
  # Cross-compile for Raspberry Pi against the official RPi kernel
  # ---------------------------------------------------------------
  rpi-cross:
    name: Raspberry Pi ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cross_compile: aarch64-linux-gnu-
            cross_pkg: gcc-aarch64-linux-gnu
            defconfig: bcm2711_defconfig
            artifact: rpi-arm64

          - arch: arm
            cross_compile: arm-linux-gnueabihf-
            cross_pkg: gcc-arm-linux-gnueabihf
            defconfig: bcm2709_defconfig
            artifact: rpi-armhf

    env:
      RPI_LINUX: ${{ github.workspace }}/../rpi-linux
      ARCH: ${{ matrix.arch }}
      CROSS_COMPILE: ${{ matrix.cross_compile }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd bc flex bison libssl-dev libelf-dev \
            ${{ matrix.cross_pkg }}

      - name: Cache Raspberry Pi kernel source
        id: rpi-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RPI_LINUX }}
          key: rpi-linux-${{ matrix.arch }}-${{ matrix.defconfig }}-${{ hashFiles('src/spi-ft232h.c') }}
          restore-keys: |
            rpi-linux-${{ matrix.arch }}-${{ matrix.defconfig }}-
            rpi-linux-${{ matrix.arch }}-

      - name: Clone Raspberry Pi kernel (shallow)
        if: steps.rpi-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch rpi-6.6.y \
            https://github.com/raspberrypi/linux.git "$RPI_LINUX"

      - name: Prepare kernel build system
        run: |
          make -C "$RPI_LINUX" \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            ${{ matrix.defconfig }}
          make -C "$RPI_LINUX" \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            modules_prepare

      - name: Build module
        run: |
          make -C src \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            KBUILD_MODPOST_WARN=1 \
            KDIR="$RPI_LINUX"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spi-ft232h-${{ matrix.artifact }}
          path: |
            src/spi-ft232h.ko
            src/spi-ft232h.ko.zst
