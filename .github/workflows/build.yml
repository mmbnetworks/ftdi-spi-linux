# SPDX-License-Identifier: GPL-2.0
# Build the spi-ft232h out-of-tree kernel module for:
#   - Ubuntu x86_64 (native)
#   - Ubuntu ARM64  (native, GitHub ARM runner)
#   - Raspberry Pi arm64 / armhf (cross-compile against RPi kernel)

name: Build Driver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------
  # Native builds: x86_64 and ARM64 Ubuntu against linux-headers-generic
  # ---------------------------------------------------------------
  native:
    name: Ubuntu ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd linux-headers-generic

      - name: Build module
        run: make -C src KDIR=/usr/src/$(ls /usr/src | grep generic | tail -1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spi-ft232h-ubuntu-${{ matrix.arch }}
          path: |
            src/spi-ft232h.ko
            src/spi-ft232h.ko.zst

  # ---------------------------------------------------------------
  # DKMS package build
  # ---------------------------------------------------------------
  dkms:
    name: DKMS Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          path: ftdi-spi-linux

      - name: Install dkms build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-dkms dkms

      - name: Build package
        run: cd ftdi-spi-linux && dpkg-buildpackage -us -uc -b

      # Building the .deb only proves the packaging is well-formed. Installing it
      # is what exercises dkms.conf and catches a wrong BUILT_MODULE_NAME.
      - name: Install package and verify DKMS build
        run: |
          sudo apt-get install -y --no-install-recommends \
            linux-headers-$(uname -r)
          sudo dpkg -i ftdi-spi-linux_*_all.deb
          dkms status ftdi-spi-linux | tee /dev/stderr | grep -q installed
          modinfo spi-ft232h

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftdi-spi-linux
          path: ftdi-spi-linux_*_all.deb


  # ---------------------------------------------------------------
  # Cross-compile for Raspberry Pi against the official RPi kernel
  # ---------------------------------------------------------------
  rpi-cross:
    name: Raspberry Pi ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cross_compile: aarch64-linux-gnu-
            cross_pkg: gcc-aarch64-linux-gnu
            defconfig: bcm2711_defconfig
            artifact: rpi-arm64

          - arch: arm
            cross_compile: arm-linux-gnueabihf-
            cross_pkg: gcc-arm-linux-gnueabihf
            defconfig: bcm2709_defconfig
            artifact: rpi-armhf

    env:
      RPI_LINUX: ${{ github.workspace }}/../rpi-linux
      ARCH: ${{ matrix.arch }}
      CROSS_COMPILE: ${{ matrix.cross_compile }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd bc flex bison libssl-dev libelf-dev \
            ${{ matrix.cross_pkg }}

      - name: Cache Raspberry Pi kernel source
        id: rpi-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RPI_LINUX }}
          key: rpi-linux-${{ matrix.arch }}-${{ matrix.defconfig }}-${{ hashFiles('src/spi-ft232h.c') }}
          restore-keys: |
            rpi-linux-${{ matrix.arch }}-${{ matrix.defconfig }}-
            rpi-linux-${{ matrix.arch }}-

      - name: Clone Raspberry Pi kernel (shallow)
        if: steps.rpi-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch rpi-6.6.y \
            https://github.com/raspberrypi/linux.git "$RPI_LINUX"

      - name: Prepare kernel build system
        run: |
          make -C "$RPI_LINUX" \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            ${{ matrix.defconfig }}
          make -C "$RPI_LINUX" \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            modules_prepare

      - name: Build module
        run: |
          make -C src \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            KBUILD_MODPOST_WARN=1 \
            KDIR="$RPI_LINUX"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spi-ft232h-${{ matrix.artifact }}
          path: |
            src/spi-ft232h.ko
            src/spi-ft232h.ko.zst
